<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0a0412" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#892cdc" stroke-width="2" opacity="0.6" />
  
  <!-- Outer Chip Pins -->
  <path d="M 20 6 V 14 M 32 6 V 14 M 44 6 V 14" stroke="#bc6ff1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 20 50 V 58 M 32 50 V 58 M 44 50 V 58" stroke="#bc6ff1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 6 20 H 14 M 6 32 H 14 M 6 44 H 14" stroke="#bc6ff1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50 20 H 58 M 50 32 H 58 M 50 44 H 58" stroke="#bc6ff1" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Chip Body -->
  <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#chipGrad)" stroke="#892cdc" stroke-width="2" />
  
  <!-- Core Processor Die -->
  <rect x="24" y="24" width="16" height="16" rx="4" fill="#0a0412" stroke="#bc6ff1" stroke-width="2" />
  
  <!-- Inner Circuit Traces -->
  <circle cx="32" cy="32" r="3" fill="#bc6ff1" />
  
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#892cdc" />
      <stop offset="100%" stop-color="#52057b" />
    </linearGradient>
